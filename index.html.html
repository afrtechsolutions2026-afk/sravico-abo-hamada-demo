function home(){let c=C(),platforms=P(),active=platforms.filter(x=>c.activePlatforms?.[x]),pending=c.tasks.filter(t=>t.owner==='client'&&t.status!=='done');let summary=platforms.map(x=>{let n=c.products.filter(p=>p.platforms?.[x]==='done').length;return `<div class="platformTile"><div class="line"><strong>${E(x)}</strong><span class="pill ${c.activePlatforms?.[x]?'done':'wait'}">${c.activePlatforms?.[x]?'المتجر مفعل':'غير مفعل'}</span></div><div class="big">${n}</div><div class="muted">منتج منشور</div></div>`}).join('');return `<div class="grid">${metric('المتاجر المفعلة',active.length+' / '+platforms.length,'منصات البيع')}${metric('المنتجات في الكتالوج',c.products.length,'موديل مسجل')}${metric('المنتجات المنشورة',c.products.filter(p=>platforms.some(x=>p.platforms?.[x]==='done')).length,'موديلات منشورة على منصة واحدة على الأقل')}${metric('المطلوب من العميل',pending.length,'إجراءات تحتاج متابعة')}${card('حالة المتاجر والمنتجات',`<div class="platformGrid">${summary}</div><p class="muted">حالة تفعيل المتجر تحددها إدارة SRAVICO. عدد المنتجات المنشورة يحدثه فريق التشغيل.</p>`)}${card('إجراءات مطلوبة من العميل',pending.map(t=>`<div class="line"><b>${E(t.name)}</b>${pill(t.status)}</div>`).join('')||'لا توجد إجراءات معلقة','w7')}${role==='admin'?card('آخر الإجراءات المسجلة',(c.activity||[]).slice(0,8).map(a=>`<div class="line"><span>${E(a.label)}</span><span class="muted">${E(a.actor)} · ${E(a.at)}</span></div>`).join('')||'لا توجد أحداث مسجلة بعد','w5'):''}</div>`}
function plan(){return `<div class="grid">${card('مراحل التنفيذ',`<div class="phasegrid">${[['01','التأسيس','المستندات وحسابات البيع'],['02','الكتالوج','المنتجات والصور'],['03','التشغيل','الطلبات والتقارير']].map(x=>`<div class="phase"><b style="color:var(--a)">${x[0]}</b><h3>${x[1]}</h3><p class="muted">${x[2]}</p></div>`).join('')}</div>`)}${card('الإجراءات',`${role==='admin'?'<button class="btn noprint" data-act="addTask">+ إجراء</button>':''}`+C().tasks.map(t=>`<div class="line"><div><b>${E(t.name)}</b><div class="muted">${t.owner==='client'?'من العميل':'من SRAVICO'} · ${E(t.note)}</div></div><div>${pill(t.status)} ${role==='admin'?`<button class="btn" data-act="task" data-id="${t.id}">تعديل</button><button class="btn" data-act="deleteTask" data-id="${t.id}">حذف</button>`:''}</div></div>`).join(''))}</div>`}

function products(){let c=C(),cols=[['name','اسم المنتج'],['model','الموديل'],['brand','البراند'],['color','اللون'],['price','سعر البيع']].filter(x=>c.columns[x[0]]!==false);return `<div class="grid">${card('قائمة المنتجات',`<div class="actions noprint" style="margin-bottom:14px"><button class="btn primary" data-act="product">+ إضافة منتج</button><button class="btn" data-act="template">تحميل قالب CSV</button><label class="btn">استيراد Excel / CSV<input id="csv" type="file" accept=".xlsx,.xls,.csv" hidden></label>${role==='admin'?'<button class="btn" data-act="columns">تخصيص الأعمدة</button>':''}</div><div class="notice">المنتجات المستوردة تظهر مباشرة في القائمة. افتح «تفاصيل / صور» لإرفاق صور متعددة لكل منتج.</div><div class="table"><table><thead><tr><th>الصورة</th>${cols.map(x=>`<th>${x[1]}</th>`).join('')}${role==='admin'?'<th>النشر</th>':''}<th>إجراء</th></tr></thead><tbody>${c.products.map(p=>`<tr><td>${p.images?.[0]?`<img class="photo" src="${p.images[0]}">`:'—'} <small>${p.images?.length||0}</small></td>${cols.map(x=>`<td>${x[0]==='price'?money(p.price):E(p[x[0]])}</td>`).join('')}${role==='admin'?`<td>${P().map(x=>`<span class="pill ${p.platforms?.[x]==='done'?'done':''}">${x}: ${p.platforms?.[x]==='done'?'منشور':p.platforms?.[x]==='work'?'جارٍ التجهيز':'لم ينشر'}</span>`).join(' ')}</td>`:''}<td><button class="btn" data-act="product" data-id="${p.id}">تفاصيل / صور</button></td></tr>`).join('')||'<tr><td colspan="9">لا توجد منتجات بعد</td></tr>'}</tbody></table></div>`)}</div>`}
function pricing(){return `<div class="grid">${card('حاسبة سعر البيع',`<div class="fields"><div class="field"><label>المنتج</label><select id="calcProduct"><option value="">حساب يدوي</option>${C().products.map(p=>`<option value="${p.id}">${E(p.name)} — ${E(p.model)}</option>`).join('')}</select></div><div class="field"><label>المنصة</label><select id="calcPlatform">${P().map(p=>`<option>${p}</option>`).join('')}</select></div>${field('sale','سعر البيع',0,'number')}<div class="field"><label>عمولة المنصة (الإدارة)</label><input id="feeDisplay" readonly></div><div class="field"><label>الشحن (الإدارة)</label><input id="shipDisplay" readonly></div>${field('other','مصاريف إضافية',0,'number')}<div class="field"><label>&nbsp;</label><button class="btn primary" id="calculate">احسب</button></div></div><div id="result" class="notice" style="margin-top:15px">أدخل السعر واختر المنصة</div>`,'w7')}${card('شرح الحساب',`<div class="line"><b>سعر البيع</b><span>القيمة المدخلة</span></div><div class="line"><b>العمولة</b><span>نسبة تحددها الإدارة</span></div><div class="line"><b>الشحن</b><span>قيمة تحددها الإدارة</span></div><div class="notice">المتبقي بعد الرسوم ليس صافي الربح؛ لا تظهر تكلفة شراء المنتج ضمن بيانات الكتالوج أو الحاسبة.</div>`,'w5')}</div>`}
function settings(){let c=C();return `<div class="grid">${card('هوية العميل',`<form id="settingsForm" class="fields">${field('name','اسم العميل',c.name)}<div class="field"><label>السوق</label><select name="country"><option value="EG" ${c.country==='EG'?'selected':''}>مصر — Amazon / Noon / Jumia</option><option value="SA" ${c.country==='SA'?'selected':''}>السعودية — Amazon / Noon / Trendyol</option></select></div>${field('start','بداية فترة العمل',c.start,'date')}${field('color','لون العميل',c.color,'color')}<button class="btn primary wide">حفظ</button></form>`,'w6')}${card('تفعيل المتاجر',`<form id="activationForm" class="fields">${P().map(x=>`<label class="line"><span>${x}</span><span><input type="checkbox" name="active_${x}" ${c.activePlatforms?.[x]?'checked':''}> متجر مفعل</span></label>`).join('')}<button class="btn primary wide">حفظ حالات التفعيل</button></form><p class="muted">هذه الحالة مستقلة عن نشر المنتجات، ولا يستطيع العميل تعديلها.</p>`,'w6')}${card('العمولات وتكلفة الشحن',`<form id="feesForm" class="fields">${P().map(x=>`<div class="field"><label>${x} — العمولة %</label><input name="rate_${x}" type="number" min="0" max="100" step="0.1" value="${c.fees[x]?.rate??10}"></div><div class="field"><label>${x} — الشحن</label><input name="ship_${x}" type="number" min="0" step="0.01" value="${c.fees[x]?.ship??0}"></div>`).join('')}<button class="btn primary wide">حفظ الرسوم</button></form><p class="muted">هذه رسوم تقديرية قابلة للتعديل لكل عميل ومنصة.</p>`,'w6')}${card('البيانات',`<div class="notice">هذه نسخة محلية تجريبية؛ عرض العميل ليس نظام صلاحيات حقيقيًا. لا تستخدمها لمشاركة بيانات حساسة.</div><div class="actions" style="margin-top:15px"><button class="btn" data-act="export">تصدير JSON</button><button class="btn" data-act="import">استيراد JSON</button><button class="btn" data-act="deleteClient">حذف العميل</button></div>`)}</div>`}
function showModal(html){Q('modal').innerHTML=`<div class="modalback"><div class="modal"><div class="line" style="margin-bottom:18px"><h2 style="margin:0">${html.title}</h2><button class="btn" data-act="close">إغلاق</button></div>${html.body}</div></div>`}function taskModal(t){showModal({title:'تحديث الإجراء',body:`<form id="taskForm" data-id="${t?.id||''}" class="fields">${field('name','اسم الإجراء',t?.name||'')}<div class="field"><label>المسؤول عن الإجراء</label><select name="owner"><option value="client" ${t?.owner==='client'?'selected':''}>العميل</option><option value="team" ${t?.owner==='team'?'selected':''}>SRAVICO</option></select></div><div class="field"><label>الحالة</label><select name="status">${['wait','work','blocked','done'].map(s=>`<option value="${s}" ${t?.status===s?'selected':''}>${({wait:'لم يبدأ',work:'جارٍ العمل',blocked:'بانتظار العميل',done:'مكتمل'})[s]}</option>`).join('')}</select></div>${field('note','ملاحظة',t?.note||'')}<button class="btn primary wide">حفظ</button></form>`})}
function productModal(p){let c=C();showModal({title:p?'بيانات وصور المنتج':'إضافة منتج',body:`<form id="productForm" data-id="${p?.id||''}" class="fields">${field('name','اسم المنتج',p?.name||'')}${field('model','رقم الموديل',p?.model||'')}${field('brand','البراند',p?.brand||c.brand)}${field('color','اللون / الاختلاف',p?.color||'')}${field('price','سعر البيع',p?.price||0,'number')}${field('sku','SKU',p?.sku||'')}<div class="field wide"><label>إضافة صور (يمكن تحديد أكثر من صورة)</label><input id="productImage" type="file" accept="image/*" multiple><div class="actions">${(p?.images||[]).map((img,i)=>`<div><img class="photo" src="${img}"><button class="btn" type="button" data-act="removeImage" data-id="${p.id}" data-index="${i}">حذف الصورة</button></div>`).join('')}</div></div>${role==='admin'?`<div class="field wide"><label>حالة النشر — للإدارة فقط</label><div class="fields">${P().map(x=>`<div class="field"><label>${x}</label><select name="platform_${x}"><option value="wait">لم ينشر</option><option value="work" ${p?.platforms?.[x]==='work'?'selected':''}>جارٍ التجهيز</option><option value="done" ${p?.platforms?.[x]==='done'?'selected':''}>منشور</option></select></div>`).join('')}</div></div>`:''}<button class="btn primary wide">حفظ المنتج</button>${p&&role==='admin'?`<button class="btn wide" type="button" data-act="deleteProduct" data-id="${p.id}">حذف المنتج</button>`:''}</form>`})}
function columnsModal(){showModal({title:'الأعمدة الظاهرة في الكتالوج',body:`<form id="columnsForm" class="fields">${[['name','اسم المنتج'],['model','الموديل'],['brand','البراند'],['color','اللون'],['price','سعر البيع']].map(([k,t])=>`<label><input type="checkbox" name="${k}" ${C().columns[k]!==false?'checked':''}> ${t}</label>`).join('')}<button class="btn primary wide">حفظ الأعمدة</button></form>`})}
function exportJSON(){let b=new Blob([JSON.stringify({kind:'SRAVICO_CLIENT_V1',clientId:C().id,client:C()},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='SRAVICO_Workspace_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function csvTemplate(){let csv='\ufeffاسم المنتج,الموديل,البراند,اللون,سعر البيع,SKU\n';download(csv,'SRAVICO_Products_Template.csv','text/csv')}function download(data,name,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function shrink(file){return new Promise((resolve,reject)=>{let img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{let cv=document.createElement('canvas'),r=Math.min(1,750/Math.max(img.width,img.height));cv.width=Math.round(img.width*r);cv.height=Math.round(img.height*r);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);resolve(cv.toDataURL('image/jpeg',.73))};img.onerror=reject;img.src=u})}
document.addEventListener('click',e=>{let n=e.target.closest('[data-page]');if(n){page=n.dataset.page;render();return}let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act,k=b.dataset.id;if(a==='close'){Q('modal').innerHTML='';return}if(a==='columns'&&role==='admin'){columnsModal();return}if(a==='deleteTask'&&role==='admin'){if(confirm('حذف الإجراء؟')){C().tasks=C().tasks.filter(t=>t.id!==k);save();render()}return}if(a==='removeImage'){let p=C().products.find(p=>p.id===k);if(p){p.images.splice(+b.dataset.index,1);save();productModal(p)}return}if(a==='deleteClient'&&role==='admin'){if(db.clients.length<2){alert('احتفظ بعميل واحد على الأقل');return}if(confirm('حذف العميل نهائيًا؟')){db.clients=db.clients.filter(x=>x.id!==C().id);db.selected=db.clients[0].id;save();page='home';render()}return}if(a==='task'&&role==='admin'){taskModal(C().tasks.find(t=>t.id===k));return}if(a==='addTask'&&role==='admin'){taskModal(null);return}if(a==='product'){productModal(C().products.find(p=>p.id===k));return}if(a==='deleteProduct'&&role==='admin'){if(confirm('حذف هذا المنتج؟')){C().products=C().products.filter(p=>p.id!==k);save();Q('modal').innerHTML='';render()}return}if(a==='export'){exportJSON();return}if(a==='import'){Q('import').click();return}if(a==='template'){csvTemplate();return}});
document.addEventListener('submit',async e=>{if(!['company','settingsForm','feesForm','activationForm','columnsForm','taskForm','productForm'].includes(e.target.id))return;e.preventDefault();let f=e.target,d=Object.fromEntries(new FormData(f)),c=C();if(f.id==='company'){for(let k of ['name','brand','cr','tax','bank','email','phone','address'])c[k]=d[k]||''}if(f.id==='settingsForm'){c.name=d.name;c.country=d.country;c.start=d.start;c.color=d.color}if(f.id==='activationForm'&&role==='admin'){for(let x of P())c.activePlatforms[x]=!!d['active_'+x]}if(f.id==='feesForm'){for(let x of P())c.fees[x]={rate:Math.max(0,Math.min(100,+d['rate_'+x]||0)),ship:Math.max(0,+d['ship_'+x]||0)}}if(f.id==='columnsForm'){for(let k of ['name','model','brand','color','price'])c.columns[k]=!!d[k]}if(f.id==='taskForm'&&role==='admin'){let t=c.tasks.find(t=>t.id===f.dataset.id);if(!t){t={id:uid()};c.tasks.push(t)}Object.assign(t,{name:d.name,owner:d.owner,status:d.status,note:d.note})}if(f.id==='productForm'){let p=c.products.find(p=>p.id===f.dataset.id);if(!p){p={id:uid(),platforms:{},images:[]};c.products.push(p)}Object.assign(p,{name:d.name,model:d.model,brand:d.brand,color:d.color,price:+d.price||0,sku:d.sku||''});if(role==='admin')for(let x of P())p.platforms[x]=d['platform_'+x];let files=Array.from(Q('productImage')?.files||[]);for(let image of files){try{if((p.images||[]).length>=8){alert('الحد التجريبي 8 صور لكل منتج');break}p.images.push(await shrink(image))}catch{alert('تعذر قراءة الصورة')}}p.image=p.images[0]||''}if(role==='client'){c.activity||=[];c.activity.unshift({actor:'العميل (معاينة)',label:'تعديل بيانات منتج: '+(p.name||''),at:new Date().toLocaleString('ar-EG')});}save();Q('modal').innerHTML='';render()});
Q('backup').onclick=()=>exportJSON();Q('restore').onclick=()=>Q('import').click();Q('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.kind!=='SRAVICO_CLIENT_V1'||d.clientId!==CONFIG.id||!Array.isArray(d.client.products))throw Error();if(confirm('استبدال بياناتك المحفوظة؟')){let old=C(),v=d.client;for(let k of ['brand','cr','tax','bank','email','phone','address'])old[k]=String(v[k]||'');old.products=v.products.map(p=>({id:p.id||uid(),name:p.name||'',model:p.model||'',brand:p.brand||'',color:p.color||'',price:+p.price||0,sku:p.sku||'',images:Array.isArray(p.images)?p.images.filter(x=>typeof x==='string'&&x.startsWith('data:image/')):[],platforms:old.products.find(x=>x.id===p.id)?.platforms||{}}));save();render()}}catch{alert('الملف غير صالح أو يخص عميلًا آخر')}e.target.value=''};
function parseCSV(text){let out=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))out.push(row);row=[];cell=''}else cell+=ch}row.push(cell);if(row.some(x=>x.trim()))out.push(row);return out}
async function importProducts(file){let rows=[];if(/\.xlsx?$/i.test(file.name)){if(typeof XLSX==='undefined'){alert('استيراد Excel يتطلب اتصالًا بالإنترنت لتحميل مكتبة Excel. استخدم CSV دون إنترنت.');return}let book=XLSX.read(await file.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{header:1,defval:''})}else rows=parseCSV((await file.text()).replace(/^\ufeff/,''));if(rows.length<2){alert('الملف لا يحتوي على منتجات');return}let headers=rows[0].map(x=>String(x).trim().toLowerCase()),get=(r,names,pos)=>{let idx=headers.findIndex(h=>names.some(n=>h===n.toLowerCase()));return String(r[idx<0?pos:idx]??'').trim()};let count=0;for(let r of rows.slice(1)){let name=get(r,['اسم المنتج','product name','name'],0);if(!name)continue;C().products.push({id:uid(),name,model:get(r,['الموديل','رقم الموديل','model'],1),brand:get(r,['البراند','brand'],2),color:get(r,['اللون','color'],3),price:+get(r,['سعر البيع','price','selling price'],4)||0,sku:get(r,['sku','كود المنتج'],5),images:[],platforms:{}});count++}save();render();alert('تم استيراد '+count+' منتج، ويمكنك الآن إضافة الصور لكل منتج.')}function syncFees(){let p=Q('calcPlatform');if(!p)return;let v=C().fees[p.value]||{rate:10,ship:0};Q('feeDisplay').value=v.rate+'%';Q('shipDisplay').value=money(v.ship)}document.addEventListener('change',async e=>{if(e.target.id==='csv'){let f=e.target.files[0];if(f)try{await importProducts(f)}catch(err){alert('تعذر قراءة الملف: '+err.message)}e.target.value=''}if(e.target.id==='calcPlatform')syncFees();if(e.target.id==='calcProduct'){let p=C().products.find(p=>p.id===e.target.value);if(p)document.querySelector('[name=sale]').value=p.price}});document.addEventListener('click',e=>{if(e.target.id!=='calculate')return;let v=n=>Math.max(0,+document.querySelector('[name='+n+']').value||0),sale=v('sale'),feeInfo=C().fees[Q('calcPlatform').value]||{rate:10,ship:0},fee=sale*feeInfo.rate/100,net=sale-fee-feeInfo.ship-v('other');Q('result').innerHTML=`<div class="line"><b>عمولة المنصة</b><span>${money(fee)}</span></div><div class="line"><b>تكلفة الشحن</b><span>${money(feeInfo.ship)}</span></div><div class="line"><b>المتبقي بعد الرسوم والشحن</b><b>${money(net)}</b></div><div class="muted">قبل تكلفة المنتج والضرائب وأي رسوم أخرى غير مدخلة.</div>`});const oldRender=render;render=function(){oldRender();syncFees()};render();
</script></body></html>
